name: Actualizar apartamentos

# Cada 6 horas busca anuncios nuevos, regenera los datos de la página (docs/data) y los
# guarda en el repositorio. Vercel está conectado al repositorio: cada vez que este robot
# guarda cambios, Vercel vuelve a publicar la página sola.
# Cada 3 días además busca noticias por barrio y, si hay algo nuevo, la IA lo investiga.

on:
  schedule:
    # Hora UTC. En Colombia: 1:23, 7:23, 13:23 y 19:23
    - cron: "23 0,6,12,18 * * *"
  workflow_dispatch: {}   # botón "Run workflow" para correrlo a mano
  push:
    branches: [main]
    paths: ["docs/**", "scraper/**", "config.py", "!docs/data/**"]   # republica si cambias el diseño o el código

permissions:
  contents: write   # guardar data/ y docs/data/

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # siempre la punta de main: un run en cola no debe trabajar sobre datos viejos

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr scrapers
        timeout-minutes: 48
        env:
          # Claves de IA guardadas como secretos del repositorio (nunca en el código)
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        # En un push (cambio de diseño o de código) solo regenera la página sin volver a raspar
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python -m scraper.publicar
          else
            python -m scraper.run
          fi

      - name: Guardar datos y página
        # always(): si la corrida falló o se cortó, igual se guarda lo avanzado (cursores, cachés).
        # Solo se guarda docs/data si quedó una página completa (listings.json existe).
        if: always()
        run: |
          git config user.name "actualizador-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/noticias_barrios.json 2>/dev/null || git add data
          if [ -f docs/data/listings.json ]; then git add -f docs/data; fi
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -q -m "Datos $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 15))
          done
          echo "::error::No se pudieron guardar los datos tras 3 intentos"
          exit 1

      - name: Revisar salud de las fuentes
        # Si un portal no entrega anuncios en 2 corridas seguidas, el run queda en rojo (GitHub avisa por correo)
        if: github.event_name != 'push'
        run: |
          python - <<'EOF'
          import json, sys
          c = json.load(open("data/corridas.json", encoding="utf-8"))[-2:]
          mala = lambda r, f: (r["fuentes"].get(f) or {}).get("error") or not ((r["fuentes"].get(f) or {}).get("leidos") or (r["fuentes"].get(f) or {}).get("omitida"))
          caidas = [f for f in c[-1]["fuentes"] if len(c) == 2 and all(mala(r, f) for r in c)]
          if caidas:
              print(f"::error::Sin datos en 2 corridas seguidas: {', '.join(caidas)}"); sys.exit(1)
          print("Fuentes OK")
          EOF
